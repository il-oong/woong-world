name: JARVIS 클라우드 개발
# 웅허브에서 승인된 개발 요청(jarvis-dev 라벨 이슈)을 Claude가 구현하고 PR만 연다. 머지는 사람이 한다.
on:
  issues:
    types: [labeled]
jobs:
  implement:
    if: github.event.label.name == 'jarvis-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            위 요청을 구현해라. CLAUDE.md/AGENTS.md 지침을 따르고, 파일 수정과 `npm run lint`, `npm run build` 확인만 해라.
            git 명령(브랜치, 커밋, push)과 PR 생성은 하지 마라. 워크플로가 대신 한다.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,Bash(npm run lint:*),Bash(npm run build:*),Bash(npm run test:*),Bash(npx tsc:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
      - name: 거부된 도구 요약 (디버깅)
        if: always()
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          [ -f "$f" ] && jq -r '.. | objects | select(has("permission_denials")) | .permission_denials[]? | "거부: \(.tool_name) \((.tool_input.command // .tool_input.file_path // "") | tostring | .[0:100])"' "$f" || true
      - name: 변경 커밋 및 push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="claude/issue-${ISSUE}"
          # claude-code-action이 끝나며 앱 토큰을 폐기하므로 원격 인증을 다시 설정한다.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "$ISSUE_TITLE" -m "Closes #${ISSUE}"
          fi
          git fetch origin "$BASE"
          if [ "$(git rev-list --count "origin/${BASE}..HEAD")" = "0" ]; then
            gh issue comment "$ISSUE" --body "에이전트가 변경한 파일이 없어 PR을 만들지 못했습니다. Actions 로그를 확인하세요."
            exit 1
          fi
          git push origin "$BRANCH"
      - name: PR 생성
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          BRANCH="claude/issue-${ISSUE}"
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            gh issue comment "$ISSUE" --body "에이전트가 $BRANCH 브랜치를 push하지 않아 PR을 만들지 못했습니다. Actions 로그를 확인하세요."
            exit 1
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state all --json number --jq '.[].number')" ]; then exit 0; fi
          gh pr create --base "$BASE" --head "$BRANCH" \
            --title "$ISSUE_TITLE" \
            --body "Closes #${ISSUE}"$'\n\n'"웅허브 JARVIS가 요청한 작업입니다. 머지는 직접 결정하세요."
