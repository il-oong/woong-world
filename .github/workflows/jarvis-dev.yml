name: JARVIS 클라우드 개발
# 웅허브에서 승인된 개발 요청(jarvis-dev 라벨 이슈)을 Claude가 구현하고 PR만 연다. 머지는 사람이 한다.
on:
  issues:
    types: [labeled]
jobs:
  implement:
    if: github.event.label.name == 'jarvis-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            위 요청을 구현해라. CLAUDE.md/AGENTS.md 지침을 따르고, 새 브랜치 claude/issue-${{ github.event.issue.number }} 에 커밋한 뒤
            `npm run lint` 와 `npm run build` 가 통과하는지 확인하고 PR을 열어라. PR 본문에 "Closes #${{ github.event.issue.number }}" 를 넣어라.
            main에 직접 push하거나 머지하지 마라.
          claude_args: --max-turns 40
