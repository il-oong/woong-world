name: 청약 공고 하루 한 번 갱신
on:
  schedule:
    - cron: '17 2 * * *' # 한국시간 11:17
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 공식 청약홈 API 자료 확인
        env:
          APPLYHOME_SERVICE_KEY: ${{ secrets.APPLYHOME_SERVICE_KEY }}
        run: npm run sync:housing
      - name: 검증
        run: |
          npm run test:housing
          npm run build
      - name: 변경된 공고 공개
        run: |
          if git diff --quiet -- src/data/housing-feed.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/housing-feed.json
          git commit -m "data: refresh housing notices"
          git push
